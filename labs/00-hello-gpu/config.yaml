# Lab 00 — prove the loop. One GPU, one model, one request, eight timings.
lab: 00-hello-gpu

pod:
  gpu: "NVIDIA L4"          # RunPod gpuTypeId
  card: l4                  # -> common.vram.CARDS
  count: 1
  cloud: SECURE
  datacenter: US-MO-2       # must match the volume's building
  network_volume_id: 59jaue9ud8   # repo + weights arrive already mounted
  image: vllm/vllm-openai:v0.29.0-cu129   # pinned 2026-09-19; 10.7 GB compressed
  container_disk_gb: 30     # image unpacks ~15-20 GB
  ports: ["22/tcp"]         # SSH only — vLLM is reached on localhost, never exposed
  price_per_gpu_hr: 0.49

model:
  repo: "Qwen/Qwen3.5-4B"
  weights_gb: 9.34
  key: qwen3.5-4b           # -> common.vram.MODELS

serve:
  tensor_parallel_size: 1
  max_model_len: 32768      # 262144 is supported; leashed for a smoke test
  port: 8000

smoke:
  prompt: "In one sentence, what does tensor parallelism do?"
  max_tokens: 64
